name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. BUILD + TEST
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build -o go-web-app .

      - name: Run tests
        run: go test ./...


  # ============================================================
  # 2. CODE QUALITY
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13


  # ============================================================
  # 3. DOCKER BUILD + PUSH
  # ============================================================
  docker:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: shru11091
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            shru11091/go-web-app:${{ github.run_id }}
            shru11091/go-web-app:latest


  # ============================================================
  # 4. UPDATE HELM
  # ============================================================
  update-helm:
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Helm image tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' \
          helm/go-web-app-chart/values.yaml

      - name: Show updated Helm values
        run: |
          cat helm/go-web-app-chart/values.yaml

      - name: Commit and push Helm change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/go-web-app-chart/values.yaml

          git commit -m "Update Helm image tag to ${{ github.run_id }}"

          git push