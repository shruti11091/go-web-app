name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. BUILD + TEST
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build -o go-web-app .

      - name: Run tests
        run: go test ./...


  # ============================================================
  # 2. CODE QUALITY
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13


  # ============================================================
  # 3. BUILD DOCKER IMAGE + PUSH TO DOCKER HUB
  # ============================================================
  push:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------
      # Diagnostic information
      # --------------------------------------------------------
      - name: Check Docker
        run: |
          docker version
          docker info

      # --------------------------------------------------------
      # Check that Docker Hub registry is reachable
      # --------------------------------------------------------
      - name: Check Docker Hub registry
        run: |
          curl -i https://registry-1.docker.io/v2/ | head -20

      # --------------------------------------------------------
      # Test Docker Hub authentication directly
      # --------------------------------------------------------
      - name: Test Docker Hub authentication
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS \
            -o /tmp/docker-auth-response.json \
            -w "%{http_code}" \
            -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DOCKERHUB_USERNAME}/go-web-app:pull,push")

          echo "Docker Hub authentication HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Docker Hub authentication failed."
            cat /tmp/docker-auth-response.json
            exit 1
          fi

          echo "Docker Hub authentication succeeded."

      # --------------------------------------------------------
      # Docker login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      # --------------------------------------------------------
      # Build Docker image and push
      # --------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:latest


  # ============================================================
  # 4. UPDATE HELM IMAGE TAG
  # ============================================================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update image tag in Helm values
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' \
          helm/go-web-app-chart/values.yaml

      - name: Show updated Helm values
        run: |
          cat helm/go-web-app-chart/values.yaml

      - name: Commit and push Helm update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/go-web-app-chart/values.yaml

          git commit -m "Update Helm image tag to ${{ github.run_id }}"

          git push