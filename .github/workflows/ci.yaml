# CI/CD using GitHub Actions

name: CI/CD

# Don't run CI when only Helm/K8s/README files change
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

# Allow GitHub Actions to commit the updated Helm values
permissions:
  contents: write

jobs:

  # ==========================================================
  # BUILD + TEST
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o go-web-app .

      - name: Test
        run: go test ./...


  # ==========================================================
  # CODE QUALITY
  # ==========================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13


  # ==========================================================
  # DOCKER BUILD + PUSH
  # ==========================================================
  push:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}


  # ==========================================================
  # UPDATE HELM IMAGE TAG
  # ==========================================================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update tag in Helm chart
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' \
          helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add helm/go-web-app-chart/values.yaml

          git commit -m "Update tag in Helm chart"

          git push